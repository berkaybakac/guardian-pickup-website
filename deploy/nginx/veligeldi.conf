server {
    listen 80;
    listen [::]:80;

    server_name veligeldi.com www.veligeldi.com;

    root /var/www/veligeldi;
    index index.html;
    charset utf-8;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = / {
        try_files /index.html =404;
    }

    location = /urun {
        try_files /product.html =404;
    }

    location = /fiyatlar {
        try_files /pricing.html =404;
    }

    location = /iletisim {
        try_files /contact.html =404;
    }

    location = /gizlilik {
        try_files /privacy.html =404;
    }

    location = /indir {
        try_files /download.html =404;
    }

    location ~ ^/(urun|fiyatlar|iletisim|gizlilik|indir)/$ {
        return 301 /$1;
    }

    location ~* \.(?:css|js|jpg|png|svg|webp|woff2)$ {
        expires 7d;
        try_files $uri =404;
    }

    location / {
        try_files $uri =404;
    }
}

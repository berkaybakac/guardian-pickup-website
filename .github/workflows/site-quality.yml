name: Site quality

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: |
          node --check website/js/main.js
          node --check scripts/serve.mjs
          node --check scripts/sync-shared-html.mjs
          node --check scripts/validate.mjs

      - name: Check shared HTML
        run: node scripts/sync-shared-html.mjs --check

      - name: Validate static site
        run: node scripts/validate.mjs
